    <style>
      @import url("https://fonts.googleapis.com/css2?family=Boldonse&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap");

      /* ----- INICI VARIABLES I BASE ----- */
      :root {
        --base-100: #f0eeee;
        --base-200: #a374ff;
        --base-300: #222225;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Google Sans Flex", sans-serif;
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ----- INICI TIPOGRAFIA ----- */
      h1 {
        font-size: clamp(2.5rem, 5vw, 5rem);
        line-height: 1.35;
      }

      h3,
      h6 {
        font-family: "Google Sans Flex";
        font-weight: 450;
        line-height: 1.35;
        letter-spacing: -2%;
      }

      h3 {
        font-size: clamp(1.5rem, 3vw, 3rem);
      }

      h6 {
        font-size: clamp(1rem, 1.25vw, 1.5rem);
      }

      p {
        text-transform: uppercase;
        font-family: 'Google Sans Flex';
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.25rem;
      }

      /* ----- INICI SECCIÓ HERO ----- */
      .hero {
        position: relative;
        width: 100%;
        height: 100svh;
        background: linear-gradient(180deg, #5b586e 0%, #0d0d0d 100%);
      }

      /* ----- INICI NAVEGACIÓ I TOGGLE ----- */
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }

      .nav-logo,
      .menu-logo {
        position: absolute;
        top: 2rem;
        left: 2rem;
        width: 6rem;
      }
      /* Botón toggle */
      .nav-toggle {
        position: absolute;
        top: 2rem;
        right: 2rem;
        color: var(--base-100);
        cursor: pointer;
        z-index: 100;
        padding: 0.5rem;
      }

      .nav-logo,
      .nav-toggle {
        padding: 0.5rem;
        pointer-events: all;
      }

      .nav-toggle-menu {
        color: var(--base-100);
      }

      .nav-toggle-close {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        color: var(--base-300);
        opacity: 0;
      }

      /* ----- INICI MENÚ FULLSCREEN ----- */
      .menu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100svh;
        padding: 2.5rem;
        display: flex;
        gap: 2rem;
        color: var(--base-300);
        pointer-events: none;
        z-index: 10;
      }

      /* Clases dinámicas controlades per Gsap */
      .menu.is-open {
        pointer-events: all;
      }

      .menu-bg-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
      }

      .menu-logo {
        opacity: 0;
        padding: 0.5rem;
      }

      .menu-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      .menu-col a {
        text-decoration: none;
        color: var(--base-300);
        font-family: "Boldonse";
        font-size: clamp(2.5rem, 5vw, 5rem);
        line-height: 1.35;
        display: block;
        /* Espai clicable nomes les lletres (no els marges) */
        width: max-content;
        overflow: visible;
      }

      .menu-col p {
        color: var(--base-200);
        margin-bottom: 1rem;
      }

      .menu a .char,
      .menu-col h3,
      .menu-col h6,
      .menu-col p {
        will-change: transform, opacity;
      }

      @media (max-width: 1000px) {
        .menu {
          flex-direction: column-reverse;
        }

        .menu-col-links {
          flex: 1.5;
        }
      }
    </style>
  </head>
  <body>

      <div class="menu">

          <path id="menu-path" fill="#f0eeee" d="M1131,0 Q565.5,0 0,0 L0,0 L1131,0 Z"/> 
        </svg>

        <div class="menu-logo">
          <a href="../advanced_index.html">

        </div>

        <div class="menu-col menu-col-info">
            <p>Get in touch</p>
            <h3>studio@clikd.co</h3>

            <br />
            <h6>42 Mercer Street</h6>
            <h6>Toronto, ON M5V</h6>
        </div>

        <div class="menu-col menu-col-links">
            <a href="../../../index.html">Home</a>
            <a href="../advanced_index.html">GsapMaster</a>
            <a href="../menus/Menu 01 - menuTop_withTransition.html">Menu 01</a>

       <!-- LIBRERÍAS EXTERNAS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/SplitText.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>

    <script>
      gsap.registerPlugin(SplitText);

      const navToggle = document.querySelector(".nav-toggle");
      const navToggleMenu = document.querySelector(".nav-toggle-menu");
      const navToggleClose = document.querySelector(".nav-toggle-close");
      const menu = document.querySelector(".menu");
      const menuBg = document.getElementById("menu-path");
      const menuBgSvg = document.querySelector(".menu-bg-svg");
      const menuLogo = document.querySelector(".menu-logo");
      const menuLinks = document.querySelectorAll(".menu-col-links a");
      const menuInfoItems = document.querySelectorAll(
        ".menu-col-info p, .menu-col-info h3, .menu-col-info h6"
      );
      //  Amplada exacte del svg [viewBox="0 0 1131 861"] = 1131px
      const svgWidth = menuBgSvg.viewBox.baseVal.width;
      //  Alçada exacte del svg [viewBox="0 0 1131 861"] = 861px
      const svgHeight = menuBgSvg.viewBox.baseVal.height;
      //  Centre X del svg = 1131 / 2 = 565.5px
      const svgCenterX = svgWidth / 2;

      const OPEN_HIDDEN = `M${svgWidth},0 Q${svgCenterX},0 0,0 L0,0 L${svgWidth},0 Z`;
      const OPEN_BULGE = `M${svgWidth},345 Q${svgCenterX},620 0,345 L0,0 L${svgWidth},0 Z`;
      const OPEN_FULL = `M${svgWidth},${svgHeight} Q${svgCenterX},${svgHeight} 0,${svgHeight} L0,0 L${svgWidth},0 Z`;
      const CLOSE_START = `M${svgWidth},0 Q${svgCenterX},0 0,0 L0,${svgHeight} L${svgWidth},${svgHeight} Z`;
      const CLOSE_BULGE = `M${svgWidth},350 Q${svgCenterX},130 0,350 L0,${svgHeight} L${svgWidth},${svgHeight} Z`;
      const CLOSE_HIDDEN = `M${svgWidth},${svgHeight} Q${svgCenterX},${svgHeight} 0,${svgHeight} L0,${svgHeight} L${svgWidth},${svgHeight} Z`;

      gsap.set(menuBg, { attr: { d: OPEN_HIDDEN } });

      //  Descomposició de link en lletres
      const splits = [];
      menuLinks.forEach((link) => {
        const split = new SplitText(link, { type: "chars", charsClass: "char" });
        splits.push(split);
        //  Posició inicial de cada lletra = 750% a la dreta = fora del svg
        gsap.set(split.chars, { opacity: 0, x: "750%" });
      });

      //  Posició inicial de cada item de la info fora de la vista per abaix.
      gsap.set(menuInfoItems, { opacity: 0, y: 100 });

      let isOpen = false;
      let isAnimating = false;

      const openMenu = () => {
        menu.classList.add("is-open");
        //  Animació per mostrar el "Close" i ocultar el "Menu".
        gsap.to(navToggleMenu, { duration: 0.25, opacity: 0, ease: "none" });
        gsap.to(navToggleClose, {
          duration: 0.25,
          opacity: 1,
          ease: "none",
          delay: 0.25,
        });

        const tl = gsap.timeline({
          onComplete: () => {
            isAnimating = false;
          },
        });

        //  Animació per desplegar el menú
        tl.to(menuBg, {
          duration: 0.5,
          attr: { d: OPEN_BULGE },
          ease: "power4.in",
        }).to(menuBg, {
          duration: 0.5,
          attr: { d: OPEN_FULL },
          ease: "power4.out",
        });

        tl.to(menuLogo, { duration: 0.1, opacity: 0, ease: "none" }, "-=0.75");

        //  Animació per mostrar els items de la info
        tl.to(
          menuInfoItems,
          {
            duration: 0.75,
            opacity: 1,
            y: 0,
            ease: "power3.out",
            stagger: 0.075,
          },
          "-=0.35"
        );

        //  Per poder iterar sobre tots el caràcters del menú s'ha de concatenar el arrays de splits
        const menuLinksChars = splits.flatMap((s) => s.chars);

        //  Animació per mostrar els links del menú
        tl.to(
          menuLinksChars,
          {
            duration: 1.5,
            x: "0%",
            ease: "elastic.out(1, 0.25)",
            stagger: 0.01,
          },
          0.45
        );
        // Separem la animació de opacitat perque sigui més curta que la animació de entrada
        tl.to(
          menuLinksChars,
          {
            duration: 0.75,
            opacity: 1,
            ease: "power2.out",
            stagger: 0.01,
          },
          0.45
        );
      };

      const closeMenu = () => {
        gsap.set(menuBg, { attr: { d: CLOSE_START } });

        gsap.to(navToggleClose, { duration: 0.3, opacity: 0, ease: "none" });
        gsap.to(navToggleMenu, {
          duration: 0.3,
          opacity: 1,
          ease: "none",
          delay: 0.25,
        });

        const tl = gsap.timeline({
          onComplete: () => {
            menu.classList.remove("is-open");
            gsap.set(menuBg, { attr: { d: OPEN_HIDDEN } });
            splits.forEach((split) => {
              gsap.set(split.chars, { opacity: 0, x: "750%" });
            });
            gsap.set(menuLinks, { opacity: 1 });
            gsap.set(menuInfoItems, { opacity: 0, y: 100 });
            isAnimating = false;
          },
        });

        tl.to(menuLogo, { duration: 0.3, opacity: 0 })
          .to(menuLinks, { duration: 0.3, opacity: 0 }, "<")
          .to(menuInfoItems, { duration: 0.3, opacity: 0 }, "<");

        tl.to(
          menuBg,
          { duration: 0.5, attr: { d: CLOSE_BULGE }, ease: "power3.in" },
          "<"
        ).to(menuBg, {
          duration: 0.5,
          attr: { d: CLOSE_HIDDEN },
          ease: "power3.out",
        });
      };

      navToggle.addEventListener("click", () => {
        if (isAnimating) return;
        isAnimating = true;

        isOpen = !isOpen;

        isOpen ? openMenu() : closeMenu();
      });
    </script>
  </body>
